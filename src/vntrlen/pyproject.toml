[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vntrlen"
version = "0.1.0.dev0"
description = "Absolute combined VNTR length from short-read sequencing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "pysam>=0.21",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.scripts]
vntrlen = "vntrlen.cli:main"

[tool.setuptools.packages.find]
include = ["vntrlen*"]

[tool.setuptools.package-data]
vntrlen = ["data/*.json"]
